# global configs
Global:
  checkpoints: null
  pretrained_model: null
  output_dir: "./output_train/test"
  device: "gpu"
  save_interval: 25
  eval_during_train: True
  eval_interval: 1
  epochs: 100
  print_batch_step: 20
  use_visualdl: False 
  # used for static mode and model export
  batch_infer: 1
  image_shape: [3, 224, 224]
  save_inference_dir: "./output_inference"
  use_multilabel: True

# model architecture
Arch:
  name: "ResNet101_vd_CSRA"
  pretrained: True
  class_num: 21
  infer_add_softmax: False

# loss function config for traing/eval process
Loss:
  Train:
    - MultiLabelLoss:
        weight: 1.0
        weight_ratio: True
        size_sum: True
  Eval:
    - MultiLabelLoss:
        weight: 1.0
        weight_ratio: True
        size_sum: True


Optimizer:
  name: Momentum
  momentum: 0.9
  lr:
    name: Cosine
    learning_rate: 0.01
    warmup_epoch: 5
  regularizer:
    name: 'L2'
    coeff: 0.0005

# data loader for train and eval
DataLoader:
  Train:
    dataset:
      name: MultiLabelDataset
      image_root: ["dataset/tyjt/", "dataset/slagcar/"]
      cls_label_path: "train_old.txt"
      label_ratio: True
      transform_ops:
        - DecodeImage:
            to_rgb: True
            channel_first: False
        - ResizeImage:
            size: [224, 224]
        - Padv2:
            size: [256, 256]
            pad_mode: 1
            fill_value: 0
        - RandomCropImage:
            size: [224, 224]
        - RandFlipImage:
            flip_code: 1
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ''
    sampler:
      name: DistributedBatchSampler
      batch_size: 64
      drop_last: True
      shuffle: True
    loader:
      num_workers: 8
      use_shared_memory: False
  Eval:
    dataset:
      name: MultiLabelDataset
      image_root: ["dataset/tyjt/", "dataset/slagcar/"]
      cls_label_path: "val_old.txt"
      label_ratio: True
      transform_ops:
        - DecodeImage:
            to_rgb: True
            channel_first: False
        - ResizeImage:
            size: [256, 192]
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ''
    sampler:
      name: DistributedBatchSampler
      batch_size: 64
      drop_last: False
      shuffle: False
    loader:
      num_workers: 8
      use_shared_memory: False


Metric:
  Eval:
    - ATTRMetric:


